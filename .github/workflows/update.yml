name: daily-update

on:
  schedule:
    - cron: "30 4 * * 0"   # 每周日 12:30 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh juwanhezi seed
        run: python scripts/scrape_juwanhezi.py || echo "juwan scrape failed, keep seed"
      - name: Collect & merge four upstreams (clean/ad split)
        run: python scripts/collect_merge.py --top 12
      # 测速主链路=本机计划任务 TVBox-RankAndPush（长沙移动出口，精确排序，每周日13:00）；
      # Actions 出口在美国 Azure 测国内源不准，只调山河云单点做粗排兜底；
      # 本机与山河云都失败时，保留 collect_merge 的内容量优先顺序照常出产物。
      - name: Coarse speed-rank via shanhe API (fallback; local task re-ranks precisely)
        run: python scripts/speed_rank_shanhe.py || echo "shanhe failed, keep unranked order"
      - name: Classify live sources
        run: python scripts/classify_live.py || echo "classify failed, keep table"
      - name: Regenerate README sections + live lists
        run: python scripts/gen_readme_live.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update: $(date -u '+%F %T') 四源聚合自动更新"
            git push
          fi
      - name: Move rolling tag agg-latest (jsDelivr immutable cache)
        run: |
          git tag -f agg-latest HEAD
          git push -f origin refs/tags/agg-latest
